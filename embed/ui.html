<header class="app-header">
    <div class="hdr-left">
      <span class="hdr-title">玻璃插件上下文交接确认</span>
      <span class="hdr-mode"><span class="hdr-mode-dot"></span>标准模式</span>
    </div>
    <div class="hdr-right">
      <button class="hdr-usage" id="chip-stats" aria-expanded="false" title="会话统计">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="u-main" id="u-main">54 轮 1218 步 · 275 tok/s</span>
      </button>
      <button class="hdr-usage" id="chip-tokens" aria-expanded="false" title="Token 用量">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="4" rx="5.4" ry="2.2" stroke="currentColor" stroke-width="1.2"/><path d="M2.6 4v8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2V4" stroke="currentColor" stroke-width="1.2"/><path d="M2.6 8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2" stroke="currentColor" stroke-width="1.2"/></svg>
        <span class="u-cache" id="u-cache">505M tok · 缓存命中 99.6%</span>
      </button>
      <button class="hdr-ctx" id="ctx-ring" title="上下文已用">
        <svg class="ring" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle class="ring-track" cx="10" cy="10" r="7.6" fill="none" stroke-width="2.4"/>
          <circle class="ring-fill" id="ring-fill" cx="10" cy="10" r="7.6" fill="none" stroke-width="2.4"
            stroke-dasharray="47.75" stroke-dashoffset="16.7" stroke-linecap="round"
            transform="rotate(-90 10 10)"/>
        </svg>
        <span class="ring-pct" id="ring-pct">66%</span>
      </button>
      <button class="hdr-icon" title="更多">···</button>
      <button class="hdr-icon" title="面板">▢</button>
    </div>
  </header>

  <!-- 压缩 >= 2 次时出现：顶栏正下方的建议条（可手动关闭） -->
  <div class="ctx-banner" id="ctx-advice" hidden>
    <span class="cb-text" id="ctx-advice-text">节省token建议：上下文已被压缩2次以上，建议打包上下文后重启新话题交接</span>
    <button class="cb-close" id="ctx-advice-close" title="关闭" aria-label="关闭">✕</button>
  </div>

  <!-- 弹层 ① 会话统计（时钟触发） -->
  <div class="usage-panel" id="panel-stats" hidden>
    <div class="up-head"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>会话统计</span></div>
    <div class="up-row"><span class="up-k">模型用时</span><span class="up-v" id="v-model-ms">100 分 54 秒</span></div>
    <div class="up-row"><span class="up-k">工具调用用时</span><span class="up-v" id="v-tool-ms">25 分 25 秒</span></div>
    <div class="up-row"><span class="up-k">首 token 平均（TTFT）</span><span class="up-v" id="v-ttft">2.8 秒</span></div>
    <div class="up-row"><span class="up-k">输出速度（TPS）</span><span class="up-v" id="v-tps">275 tok/s</span></div>
  </div>

  <!-- 弹层 ② Token 用量（数据库图标触发） -->
  <div class="usage-panel" id="panel-tokens" hidden>
    <div class="up-head"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="4" rx="5.4" ry="2.2" stroke="currentColor" stroke-width="1.2"/><path d="M2.6 4v8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2V4" stroke="currentColor" stroke-width="1.2"/><path d="M2.6 8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2" stroke="currentColor" stroke-width="1.2"/></svg><span>Token 用量</span><span class="up-head-v" id="v-total">505,187,136 tok</span></div>
    <div class="up-sep"></div>
    <div class="up-row"><span class="up-k">缓存命中</span><span class="up-v" id="v-hit">99.6%</span></div>
    <div class="up-row"><span class="up-k">未缓存输入</span><span class="up-v" id="v-uncached">2,001,596 tok</span></div>
    <div class="up-row"><span class="up-k">缓存读取</span><span class="up-v" id="v-cacheread">502,451,712 tok</span></div>
    <div class="up-row"><span class="up-k">输出</span><span class="up-v" id="v-output">733,828 tok</span></div>
  </div>

  <!-- 弹层 ③ 上下文已用（圆环触发；压缩后追加标注） -->
  <div class="usage-panel" id="panel-ctx" hidden>
    <div class="ctx-block">
      <div class="ctx-head">
        <span class="ctx-title">上下文已用 <b id="ctx-pct">66%</b></span>
        <span class="ctx-abs" id="ctx-abs">~661K / 1M</span>
      </div>
      <div class="ctx-bar"><span id="ctx-fill" style="width:66%"></span></div>
      <div class="ctx-legend">
        <div class="ctx-row"><span class="ctx-swatch s-sys"></span><span class="ctx-k">系统提示词</span><span class="ctx-v">~1.5K</span></div>
        <div class="ctx-row"><span class="ctx-swatch s-tool"></span><span class="ctx-k">工具定义</span><span class="ctx-v">~5.4K</span></div>
        <div class="ctx-row"><span class="ctx-swatch s-msg"></span><span class="ctx-k">对话消息</span><span class="ctx-v">~654K</span></div>
      </div>
      <div class="ctx-compact" id="ctx-compact" hidden>上下文已被压缩 <b id="ctx-compact-n">0</b> 次</div>
    </div>
  </div>
