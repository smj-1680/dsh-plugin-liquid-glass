# ============================================================================
# DSH 插件市场条目 —— 提交给 awesome-dsh-plugin/awesome-dsh-plugin
# ============================================================================
# 用法：
#   1) 把本文件【去掉注释后的 4 个字段】复制成
#        data/plugins/smj-1680__dsh-plugin-liquid-glass.yml
#      ⚠ 文件名里的仓库名大小写必须与 GitHub 仓库完全一致。
#        仓库实际名是 dsh-plugin-liquid-glass（全小写）。
#        抽查过 3 个已有条目，文件名 repo 段与条目 url 段大小写一致。
#        ❌ 旧写法 smj-1680__DSH-plugin-liquid-glass.yml 是错的。
#   2) 向那个仓库提 PR，只加这一个文件（一次 PR 最多 3 条）
#   3) 合并后两级 README 由脚本重新生成——不要手改 README
#
# 仓库地址：https://github.com/smj-1680/dsh-plugin-liquid-glass
#
# ⚠⚠ 描述准确性（这是唯一会让合格插件被打回的原因）
#   市场会拿 description 对【仓库里的代码】逐条核查，所以这里只写代码里真有的东西：
#     · 已发布版本 0.1.62 的材质是【磨砂玻璃】（backdrop-filter: blur + 内高光 + 描边）
#     · 【不是折射】—— `git show HEAD:artifacts/client.js | grep dsh-lens` = 0 次
#     · "透镜折射"那一版还在本地工作区、未提交，所以本条目【不提折射、不提透镜】
#   等透镜稳定并以快照预览版发布后，再回来更新描述。
#
# 逐条自检（对照 MARKET-SUBMIT.md 的硬性要求）：
#   ✓ package.json 声明了 dsh.bundle.patch（不是只声明 dsh.client）
#   ✓ cordis.patch.yml 存在且格式正确
#   ✓ 仓库有真实可用的代码
#   ✓ 描述只讲功能、不带营销词，且每条都能对上代码
#   ✓ 仓库创建满 1 天（实测 3.28 天，门槛是 1 天）
#   ✓ 已给仓库加 dsh-plugin topic（API 确证 topics: dsh-plugin）
#   ✓ 分类 ui（界面增强；不是 theme —— 我们不改配色，是加材质）
#   ⚠ 待办：仓库 README.md 里"输入框（真折射）"与"状态：v0.1.5"与实际不符，
#            建议提 PR 之前先修正 README，否则与条目描述的口径也会打架。
# ============================================================================

url: https://github.com/smj-1680/dsh-plugin-liquid-glass
name: smj-1680/dsh-plugin-liquid-glass
category: ui
description:
  en: 'Adds a translucent glass material to the DSH desktop interface: composer, message bubbles, assistant cards, sidebar blocks, top bar and menus. Works alongside wallpaper plugins. Dark mode only.'
  zh: 为 DSH 桌面端的主要界面元素（输入框、消息气泡、助手卡片、侧栏区块、顶栏与菜单）套上半透明玻璃材质，可搭配各类壁纸插件使用，目前仅适配深色模式。
